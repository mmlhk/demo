name: TWRP Build with Custom Kernel (K10)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MANIFEST_URL: ${{ github.event.inputs.MANIFEST_URL || 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp' }}
      MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH || 'twrp-11' }}
      DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH || 'device/k10/k10' }}
      DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME || 'k10' }}
      MAKEFILE_NAME: ${{ github.event.inputs.MAKEFILE_NAME || 'twrp_k10' }}
      BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET || 'bootimage' }}
      KERNEL_REPO: ${{ github.event.inputs.KERNEL_REPO || 'https://github.com/KrutosVIP/generic_kernel_mediatek_alps' }}
      KERNEL_BRANCH: ${{ github.event.inputs.KERNEL_BRANCH || '4.19.191_mt6765' }}
      KERNEL_DEFCONFIG: ${{ github.event.inputs.KERNEL_DEFCONFIG || 'k65v1_64_bsp_defconfig' }}
    steps:
      - name: Display Run Parameters
        run: |
          echo "Manifest: $MANIFEST_URL $MANIFEST_BRANCH"
          echo "Kernel: $KERNEL_REPO $KERNEL_BRANCH ($KERNEL_DEFCONFIG)"
          echo "Target: $BUILD_TARGET"

      - name: Check Out
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/.ghcup /usr/local/share/boost /usr/local/bin/aws* \
                       /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Prepare the environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            gperf gcc-multilib g++-multilib libc6-dev lib32ncurses-dev \
            x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev \
            build-essential git libxml2 lzop pngcrush squashfs-tools \
            imagemagick libbz2-dev lzma ncftp libstdc++-10-dev libncurses6 \
            python3 tar unzip zip bison flex libssl-dev
          if ! command -v python >/dev/null; then
            sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          fi

      - name: Install OpenJDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global user.name "k10-twrp-ci"
          git config --global user.email "k10-twrp-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      # === Phase 1: Build custom kernel ===
      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel_src
          echo "kernel source: $(du -sh kernel_src | cut -f1)"

      - name: Patch kernel defconfig for SELinux
        run: |
          DEFCFG="kernel_src/arch/arm64/configs/$KERNEL_DEFCONFIG"
          echo "=== before patch ==="
          grep -i "SELINUX" "$DEFCFG" || echo "(no SELinux config)"
          sed -i 's/# CONFIG_SECURITY_SELINUX_DEVELOP is not set/CONFIG_SECURITY_SELINUX_DEVELOP=y/' "$DEFCFG"
          grep -q "CONFIG_SECURITY_SELINUX_BOOTPARAM" "$DEFCFG" || \
            echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y" >> "$DEFCFG"
          echo "=== after patch ==="
          grep -i "SELINUX" "$DEFCFG"
          # Fix broken Kconfig files that break defconfig generation
          # (goodix_berlin_driver has non-ASCII chars in Kconfig)
          find kernel_src/drivers/input/touchscreen/mediatek -name "Kconfig" -exec sed -i 's/[^[:print:]\t]/ /g' {} \; 2>/dev/null || true

      - name: Build kernel
        run: |
          set -o pipefail
          cd kernel_src
          export ARCH=arm64
          sudo apt install -yq gcc-aarch64-linux-gnu
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Patch GCC 13 inline incompatibility with kernel 4.19:
          # uclamp_se_set is declared 'inline' in sched.h but defined in .c file
          # GCC 13 requires definition visible for inline. Remove 'inline' keyword.
          sed -i '/^inline void uclamp_se_set/s/^inline //' kernel/sched/sched.h
          grep -n "uclamp_se_set" kernel/sched/sched.h | head -2
          sed -i '/^inline void ksm_flock/s/^inline //' include/linux/keyslot-manager.h 2>/dev/null || true
          # Fix missing MTK ftrace headers (referenced via relative ./xxx_ftrace.h
          # but files don't exist or are in different dirs)
          [ -f kernel/trace/mtk_ftrace.h ] && cp kernel/trace/mtk_ftrace.h include/trace/mtk_ftrace.h 2>/dev/null || echo "/* stub */" > include/trace/mtk_ftrace.h
          # Create stubs for all missing MET ftrace headers
          for h in met_ftrace_touch.h met_ftrace_gpu.h met_ftrace_mm.h met_ftrace.h; do
            [ ! -f "include/trace/$h" ] && echo "/* stub */" > "include/trace/$h"
          done
          make $KERNEL_DEFCONFIG 2>&1 | tee /tmp/kernel_defconfig.log
          # Override Werror entirely: disable CONFIG_Werror + pass -w (suppress all warnings)
          make KCFLAGS="-w" CFLAGS_KERNEL="-w" Image.gz -j$(nproc --all) 2>&1 | tee /tmp/kernel_build.log
          ls -la arch/arm64/boot/Image.gz
          cp arch/arm64/boot/Image.gz ${GITHUB_WORKSPACE}/kernel_custom_Image.gz
        id: kernel_build

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-kernel-${{ github.run_id }}
          path: kernel_custom_Image.gz

      # === Phase 2: TWRP build ===
      - name: Initialize repo workspace
        id: pwd
        run: |
          mkdir -p workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"

      - name: Repo Sync
        run: |
          for i in 1 2 3 4 5; do
            repo sync -c --no-clone-bundle --no-tags -j8 && break
            echo "retry $i ..."; sleep 30
          done
          test -f build/envsetup.sh
          test -d bootable/recovery
          test -d vendor/twrp
        working-directory: workspace

      - name: Install device tree with custom kernel
        run: |
          SRC=${GITHUB_WORKSPACE}/device/k10/k10
          test -f "$SRC/AndroidProducts.mk"
          mkdir -p workspace/device/k10
          cp -a "$SRC" workspace/device/k10/k10
          # Replace prebuilt kernel with custom-compiled one
          cp ${GITHUB_WORKSPACE}/kernel_custom_Image.gz workspace/$DEVICE_PATH/prebuilt/Image.gz
          echo "=== prebuilt kernel ==="
          ls -la workspace/$DEVICE_PATH/prebuilt/
          file workspace/$DEVICE_PATH/prebuilt/Image.gz
        working-directory: .

      - name: Build recovery
        run: |
          set -o pipefail
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch $MAKEFILE_NAME-eng > /tmp/lunch.log 2>&1 || { cat /tmp/lunch.log; exit 1; }
          echo "=== lunch done, TARGET_PRODUCT=$TARGET_PRODUCT ==="
          make $BUILD_TARGET -j$(nproc --all) 2>&1 | tee /tmp/build.log
        working-directory: workspace

      - name: Collect artifacts
        id: collect
        continue-on-error: true
        run: |
          set +e
          PROD=$(find workspace/out/target/product -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)
          echo "PROD=$PROD"
          mkdir -p artifacts
          if [ -z "$PROD" ]; then
            echo "WARN: no product dir"
            find workspace/out -maxdepth 4 -type d 2>/dev/null | head -30 > artifacts/product_out_listing.txt
            find workspace/out -name "*.img" -type f 2>/dev/null > artifacts/img_manifest.txt
            echo "$GITHUB_RUN_ID" > artifacts/build_info.txt
            date -u > artifacts/build_date.txt
            ls -la artifacts/
            exit 0
          fi
          ls -la "$PROD" | head -60 > artifacts/product_out_listing.txt
          find workspace/out -name "*.img" -type f 2>/dev/null > artifacts/img_manifest.txt
          echo "=== all .img under out ==="
          cat artifacts/img_manifest.txt
          for f in boot.img recovery.img ramdisk-recovery.img; do
            [ -f "$PROD/$f" ] && cp -v "$PROD/$f" artifacts/
          done
          for z in "$PROD"/*.zip; do
            [ -f "$z" ] && cp -v "$z" artifacts/
          done
          echo "$GITHUB_RUN_ID" > artifacts/build_info.txt
          date -u > artifacts/build_date.txt
          echo "=== artifacts dir ==="
          ls -la artifacts/
          sha256sum artifacts/*.img 2>/dev/null || echo "(no images)"

      - name: Prepare release assets
        if: always()
        run: |
          mkdir -p release_assets
          for f in /tmp/build.log /tmp/lunch.log /tmp/kernel_build.log /tmp/kernel_defconfig.log; do
            if [ -s "$f" ]; then cp "$f" release_assets/
            else echo "(no $f produced)" > "release_assets/$(basename $f)"; fi
          done
          if [ -d artifacts ]; then
            for f in artifacts/*; do
              if [ -s "$f" ]; then cp "$f" release_assets/; fi
            done
          fi
          # Include custom kernel in release
          [ -f kernel_custom_Image.gz ] && cp kernel_custom_Image.gz release_assets/
          {
            echo "Run: $GITHUB_RUN_ID"
            echo "Date: $(date -u)"
            echo "Collect outcome: ${{ steps.collect.outcome }}"
            echo "Kernel: $KERNEL_REPO $KERNEL_BRANCH ($KERNEL_DEFCONFIG)"
            echo "--- img manifest ---"
            cat artifacts/img_manifest.txt 2>/dev/null || echo "(none)"
            echo "--- product out listing ---"
            cat artifacts/product_out_listing.txt 2>/dev/null || echo "(none)"
          } > release_assets/summary.txt
          ls -la release_assets/

      - name: Upload to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: ${{ env.DEVICE_NAME }}-twrp-customkernel-${{ github.run_id }}
          tag_name: twrp-${{ github.run_id }}
          body: |
            TWRP for K10 (MT6765) — source-built with custom kernel (SELinux DEVELOP=y)
            Kernel: ${{ env.KERNEL_REPO }} ${{ env.KERNEL_BRANCH }}
            Target: ${{ env.BUILD_TARGET }}
            Collect result: ${{ steps.collect.outcome }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
