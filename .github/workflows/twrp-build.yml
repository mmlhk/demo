name: TWRP Build (K10) — SELinux patch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MANIFEST_URL: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH: 'twrp-11'
      DEVICE_PATH: 'device/k10/k10'
      DEVICE_NAME: 'k10'
      MAKEFILE_NAME: 'twrp_k10'
      BUILD_TARGET: 'bootimage'
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/.ghcup /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Prepare the environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            gperf gcc-multilib g++-multilib libc6-dev lib32ncurses-dev \
            x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev \
            build-essential git libxml2 lzop pngcrush squashfs-tools \
            imagemagick libbz2-dev lzma ncftp libstdc++-10-dev libncurses6 \
            python3 tar unzip zip
          if ! command -v python >/dev/null; then
            sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          fi

      - name: Install OpenJDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global user.name "k10-twrp-ci"
          git config --global user.email "k10-twrp-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Initialize repo workspace
        run: |
          mkdir -p workspace
          cd workspace
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"

      - name: Repo Sync
        run: |
          for i in 1 2 3 4 5; do
            repo sync -c --no-clone-bundle --no-tags -j8 && break
            echo "retry $i ..."; sleep 30
          done
          test -f build/envsetup.sh
          test -d bootable/recovery
          test -d vendor/twrp
        working-directory: workspace

      - name: Patch init to skip SELinux policy loading
        run: |
          # Patch system/core init/selinux.cpp: make SelinuxInitialize skip LoadPolicy
          # This prevents ebitmap_write kernel panic on MTK 4.19 kernels where
          # CONFIG_SECURITY_SELINUX_DEVELOP is not set (only enforcing mode).
          SELINUX_CPP="workspace/system/core/init/selinux.cpp"
          echo "=== before patch ==="
          grep -n "SelinuxInitialize\|LoadPolicy" "$SELINUX_CPP" | head -10
          python3 - <<'PYEOF'
          f = "workspace/system/core/init/selinux.cpp"
          d = open(f).read()
          old = '''void SelinuxInitialize() {
              LOG(INFO) << "Loading SELinux policy";
              if (!LoadPolicy()) {
                  LOG(FATAL) << "Unable to load SELinux policy";
              }'''
          new = '''void SelinuxInitialize() {
              LOG(INFO) << "Loading SELinux policy";
              // TWRP patch: skip policy loading (MTK 4.19 ebitmap_write panic workaround)
              LOG(INFO) << "TWRP: skipping SELinux policy load (MTK 4.19 compat)";
              return;
              if (!LoadPolicy()) {
                  LOG(FATAL) << "Unable to load SELinux policy";
              }'''
          if old in d:
              d = d.replace(old, new)
              open(f,'w').write(d)
              print("PATCHED: SelinuxInitialize now skips LoadPolicy")
          else:
              print("WARNING: exact pattern not found, trying flexible match...")
              import re
              # More flexible match
              pattern = r'(void SelinuxInitialize\(\)\s*\{\s*LOG\(INFO\) << "Loading SELinux policy";\s*)if \(!LoadPolicy\(\)\)'
              if re.search(pattern, d):
                  d = re.sub(pattern, r'\1return; // TWRP: skip LoadPolicy (MTK 4.19 compat)\n            if (!LoadPolicy())', d)
                  open(f,'w').write(d)
                  print("PATCHED (flexible match)")
              else:
                  print("ERROR: could not find SelinuxInitialize pattern")
                  exit(1)
          PYEOF
          echo "=== after patch ==="
          grep -n "SelinuxInitialize\|LoadPolicy\|TWRP.*skip" "$SELINUX_CPP" | head -10
        working-directory: .

      - name: Install device tree
        run: |
          SRC=${GITHUB_WORKSPACE}/device/k10/k10
          mkdir -p workspace/device/k10
          cp -a "$SRC" workspace/device/k10/k10
          ls -la workspace/$DEVICE_PATH/prebuilt/
        working-directory: .

      - name: Build recovery
        run: |
          set -o pipefail
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch $MAKEFILE_NAME-eng > /tmp/lunch.log 2>&1 || { cat /tmp/lunch.log; exit 1; }
          echo "=== lunch done, TARGET_PRODUCT=$TARGET_PRODUCT ==="
          make $BUILD_TARGET -j$(nproc --all) 2>&1 | tee /tmp/build.log
        working-directory: workspace

      - name: Collect artifacts
        id: collect
        continue-on-error: true
        run: |
          set +e
          PROD=$(find workspace/out/target/product -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)
          mkdir -p artifacts
          if [ -z "$PROD" ]; then
            find workspace/out -maxdepth 4 -type d 2>/dev/null | head -30 > artifacts/product_out_listing.txt
            find workspace/out -name "*.img" -type f 2>/dev/null > artifacts/img_manifest.txt
            echo "$GITHUB_RUN_ID" > artifacts/build_info.txt
            exit 0
          fi
          ls -la "$PROD" | head -60 > artifacts/product_out_listing.txt
          find workspace/out -name "*.img" -type f 2>/dev/null > artifacts/img_manifest.txt
          cat artifacts/img_manifest.txt
          for f in boot.img recovery.img ramdisk-recovery.img; do
            [ -f "$PROD/$f" ] && cp -v "$PROD/$f" artifacts/
          done
          echo "$GITHUB_RUN_ID" > artifacts/build_info.txt
          date -u > artifacts/build_date.txt
          ls -la artifacts/
          sha256sum artifacts/*.img 2>/dev/null || echo "(no images)"

      - name: Prepare release assets
        if: always()
        run: |
          mkdir -p release_assets
          for f in /tmp/build.log /tmp/lunch.log; do
            if [ -s "$f" ]; then cp "$f" release_assets/
            else echo "(no $f)" > "release_assets/$(basename $f)"; fi
          done
          if [ -d artifacts ]; then
            for f in artifacts/*; do
              if [ -s "$f" ]; then cp "$f" release_assets/; fi
            done
          fi
          { echo "Run: $GITHUB_RUN_ID"; echo "Date: $(date -u)";
            echo "Patch: SelinuxInitialize skips LoadPolicy";
            cat artifacts/img_manifest.txt 2>/dev/null || echo "(none)"; } > release_assets/summary.txt
          ls -la release_assets/

      - name: Upload to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: k10-twrp-selinux-patch-${{ github.run_id }}
          tag_name: twrp-${{ github.run_id }}
          body: |
            TWRP for K10 (MT6765) — source-built with SelinuxInitialize patch
            Skip LoadPolicy to avoid MTK 4.19 kernel ebitmap_write panic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
