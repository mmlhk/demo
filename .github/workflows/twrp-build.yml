name: TWRP Build (K10)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Manifest repo URL (https)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'Manifest branch'
        required: true
        default: 'twrp-11'
      DEVICE_PATH:
        description: 'Device tree path in workspace'
        required: true
        default: 'device/k10/k10'
      DEVICE_NAME:
        description: 'Device codename (product out dir)'
        required: true
        default: 'k10'
      MAKEFILE_NAME:
        description: 'Lunch target prefix'
        required: true
        default: 'twrp_k10'
      BUILD_TARGET:
        description: 'Build target: bootimage (recovery-as-boot) or recoveryimage'
        required: true
        default: 'bootimage'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MANIFEST_URL: ${{ github.event.inputs.MANIFEST_URL || 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp' }}
      MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH || 'twrp-11' }}
      DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH || 'device/k10/k10' }}
      DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME || 'k10' }}
      MAKEFILE_NAME: ${{ github.event.inputs.MAKEFILE_NAME || 'twrp_k10' }}
      BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET || 'bootimage' }}
    steps:
      - name: Display Run Parameters
        run: |
          echo "Manifest: $MANIFEST_URL $MANIFEST_BRANCH"
          echo "Device path: $DEVICE_PATH"
          echo "Device name: $DEVICE_NAME"
          echo "Lunch: $MAKEFILE_NAME-eng"
          echo "Target: $BUILD_TARGET"

      - name: Check Out
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # AOSP sync needs ~35-40G free; standard runner has ~14G after preinstalls
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/.ghcup /usr/local/share/boost /usr/local/bin/aws* \
                       /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Prepare the environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            gperf gcc-multilib g++-multilib libc6-dev lib32ncurses-dev \
            x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev \
            build-essential git libxml2 lzop pngcrush squashfs-tools \
            imagemagick libbz2-dev lzma ncftp libstdc++-10-dev libncurses6 \
            python3 tar unzip zip
          # ensure 'python' exists for legacy AOSP R scripts
          if ! command -v python >/dev/null; then
            sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          fi
          python3 --version

      - name: Install OpenJDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global user.name "k10-twrp-ci"
          git config --global user.email "k10-twrp-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Initialize repo workspace
        id: pwd
        run: |
          mkdir -p workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"

      - name: Repo Sync
        run: |
          # googlesource occasionally throttles; retry with backoff
          for i in 1 2 3 4 5; do
            repo sync -c --no-clone-bundle --no-tags -j8 && break
            echo "retry $i ..."; sleep 30
          done
          # verify sync succeeded (loop exit status would mask failure)
          test -f build/envsetup.sh
          test -d bootable/recovery
          test -d vendor/twrp
        working-directory: workspace

      - name: Install device tree
        run: |
          # The repo root IS the device tree container (device/k10/k10)
          SRC=${GITHUB_WORKSPACE}/device/k10/k10
          test -f "$SRC/AndroidProducts.mk"
          mkdir -p workspace/device/k10
          cp -a "$SRC" workspace/device/k10/k10
          ls -la workspace/$DEVICE_PATH/prebuilt
          test -f workspace/$DEVICE_PATH/prebuilt/Image.gz
          test -f workspace/$DEVICE_PATH/prebuilt/dtb.img
        working-directory: .

      - name: Build recovery
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch $MAKEFILE_NAME-eng
          make $BUILD_TARGET -j$(nproc --all)
        working-directory: workspace

      - name: Collect artifacts
        run: |
          PROD=workspace/out/target/product/$DEVICE_NAME
          ls -la "$PROD" || true
          mkdir -p artifacts
          # recovery-as-boot: boot.img is the flashable image
          cp -v "$PROD"/boot.img artifacts/ 2>/dev/null || true
          cp -v "$PROD"/recovery.img artifacts/ 2>/dev/null || true
          cp -v "$PROD"/*.zip artifacts/ 2>/dev/null || true
          echo "$GITHUB_RUN_ID" > artifacts/build_info.txt
          date -u > artifacts/build_date.txt
          ls -la artifacts/
          # fail loudly if nothing was built
          ls artifacts/*.img >/dev/null 2>&1 || { echo "ERROR: no image produced"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-k10-${{ github.run_id }}
          path: artifacts/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.img
          name: ${{ env.DEVICE_NAME }}-twrp-${{ github.run_id }}
          tag_name: twrp-${{ github.run_id }}
          body: |
            TWRP for K10 (MT6765) — source-built, recovery-as-boot
            Manifest: ${{ env.MANIFEST_BRANCH }}
            Target: ${{ env.BUILD_TARGET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
