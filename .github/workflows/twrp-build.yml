name: TWRP Build with Xiaomi MT6765 Kernel

on:
  push:
    branches: [ xiaomi-kernel ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MANIFEST_URL: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH: 'twrp-11'
      DEVICE_PATH: 'device/k10/k10'
      DEVICE_NAME: 'k10'
      MAKEFILE_NAME: 'twrp_k10'
      BUILD_TARGET: 'bootimage'
      KERNEL_REPO: 'https://github.com/xiaomi-mt6765/android_kernel_xiaomi_mt6765'
      KERNEL_BRANCH: 'lineage-17.1'
      KERNEL_DEFCONFIG: 'k65v1_64_bsp_defconfig'
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/.ghcup /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Prepare the environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            gperf gcc-multilib g++-multilib libc6-dev lib32ncurses-dev \
            x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev \
            build-essential git libxml2 lzop pngcrush squashfs-tools \
            imagemagick libbz2-dev lzma ncftp libstdc++-10-dev libncurses6 \
            python3 tar unzip zip bison flex libssl-dev
          if ! command -v python >/dev/null; then
            sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          fi

      - name: Install OpenJDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global user.name "k10-twrp-ci"
          git config --global user.email "k10-twrp-ci@users.noreply.github.com"

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel_src
          echo "kernel source: $(du -sh kernel_src | cut -f1)"
          # List available defconfigs
          ls kernel_src/arch/arm64/configs/ | grep -i "mt6765\|k65\|k62\|dandelion" || true

      - name: Patch and build kernel
        run: |
          set -o pipefail
          cd kernel_src
          export ARCH=arm64
          sudo apt install -yq gcc-aarch64-linux-gnu
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Find the right defconfig
          DEFCFG=$(find arch/arm64/configs/ -name "*mt6765*" -o -name "*k65*" | head -1)
          if [ -z "$DEFCFG" ]; then
            echo "No MT6765 defconfig found, listing all:"
            ls arch/arm64/configs/
            exit 1
          fi
          echo "Using defconfig: $DEFCFG"
          DEFNAME=$(basename "$DEFCFG" .defconfig)
          # Patch SELinux: enable DEVELOP mode (allows permissive)
          sed -i 's/# CONFIG_SECURITY_SELINUX_DEVELOP is not set/CONFIG_SECURITY_SELINUX_DEVELOP=y/' "$DEFCFG" 2>/dev/null || true
          grep -q "CONFIG_SECURITY_SELINUX_BOOTPARAM" "$DEFCFG" 2>/dev/null || echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y" >> "$DEFCFG"
          grep -i "SELINUX" "$DEFCFG" || echo "(no SELinux config in defconfig)"
          # Fix non-ASCII in Kconfig files
          find drivers/input/touchscreen -name "Kconfig" -exec sed -i 's/[^[:print:]\t]/ /g' {} \; 2>/dev/null || true
          # Patch GCC 13 inline issues
          find include/ kernel/sched/ -name "*.h" -exec sed -i '/^inline /s/^inline //' {} \; 2>/dev/null || true
          # Auto-create stub headers for missing MTK BSP files
          for h in helio-dvfsrc.h mtk_sd.h mtk_ppm_platform.h mtk_ftrace.h met_ftrace_touch.h met_ftrace_gpu.h met_ftrace_mm.h met_ftrace.h; do
            grep -rl "$h" --include="*.c" --include="*.h" . 2>/dev/null | while read src; do
              d=$(dirname "$src")
              [ ! -f "$d/$h" ] && echo "/* auto-stub */" > "$d/$h"
            done || true
            [ ! -f "include/linux/$h" ] && echo "/* auto-stub */" > "include/linux/$h"
          done
          # Build
          make "$DEFNAME" KCFLAGS="-w" HOSTCFLAGS="-fcommon -w" 2>&1 | tee /tmp/kernel_defconfig.log
          make KCFLAGS="-w" HOSTCFLAGS="-fcommon -w" Image.gz -j$(nproc --all) 2>&1 | tee /tmp/kernel_build.log
          ls -la arch/arm64/boot/Image.gz
          cp arch/arm64/boot/Image.gz ${GITHUB_WORKSPACE}/kernel_custom_Image.gz
        id: kernel_build

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-kernel-${{ github.run_id }}
          path: kernel_custom_Image.gz

      - name: Initialize repo workspace
        run: |
          mkdir -p workspace
          cd workspace
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"

      - name: Repo Sync
        run: |
          for i in 1 2 3 4 5; do
            repo sync -c --no-clone-bundle --no-tags -j8 && break
            echo "retry $i ..."; sleep 30
          done
          test -f build/envsetup.sh
        working-directory: workspace

      - name: Install device tree with custom kernel
        run: |
          SRC=${GITHUB_WORKSPACE}/device/k10/k10
          mkdir -p workspace/device/k10
          cp -a "$SRC" workspace/device/k10/k10
          cp ${GITHUB_WORKSPACE}/kernel_custom_Image.gz workspace/$DEVICE_PATH/prebuilt/Image.gz
          ls -la workspace/$DEVICE_PATH/prebuilt/
        working-directory: .

      - name: Build recovery
        run: |
          set -o pipefail
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch $MAKEFILE_NAME-eng > /tmp/lunch.log 2>&1 || { cat /tmp/lunch.log; exit 1; }
          make $BUILD_TARGET -j$(nproc --all) 2>&1 | tee /tmp/build.log
        working-directory: workspace

      - name: Collect artifacts
        id: collect
        continue-on-error: true
        run: |
          set +e
          PROD=$(find workspace/out/target/product -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)
          mkdir -p artifacts
          if [ -z "$PROD" ]; then
            find workspace/out -maxdepth 4 -type d 2>/dev/null | head > artifacts/product_out_listing.txt
            find workspace/out -name "*.img" 2>/dev/null > artifacts/img_manifest.txt
            exit 0
          fi
          ls -la "$PROD" > artifacts/product_out_listing.txt
          find workspace/out -name "*.img" 2>/dev/null > artifacts/img_manifest.txt
          for f in boot.img recovery.img ramdisk-recovery.img; do
            [ -f "$PROD/$f" ] && cp "$PROD/$f" artifacts/
          done
          echo "$GITHUB_RUN_ID" > artifacts/build_info.txt
          ls -la artifacts/
          sha256sum artifacts/*.img 2>/dev/null || echo "(no images)"

      - name: Prepare release assets
        if: always()
        run: |
          mkdir -p release_assets
          for f in /tmp/build.log /tmp/lunch.log /tmp/kernel_build.log /tmp/kernel_defconfig.log; do
            if [ -s "$f" ]; then cp "$f" release_assets/
            else echo "(no $f)" > "release_assets/$(basename $f)"; fi
          done
          [ -d artifacts ] && for f in artifacts/*; do [ -s "$f" ] && cp "$f" release_assets/; done
          [ -f kernel_custom_Image.gz ] && cp kernel_custom_Image.gz release_assets/
          { echo "Run: $GITHUB_RUN_ID"; echo "Kernel: $KERNEL_REPO $KERNEL_BRANCH";
            cat artifacts/img_manifest.txt 2>/dev/null || echo "(none)"; } > release_assets/summary.txt
          ls -la release_assets/

      - name: Upload to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: k10-twrp-xiaomi-kernel-${{ github.run_id }}
          tag_name: twrp-${{ github.run_id }}
          body: |
            TWRP for K10 with Xiaomi MT6765 kernel (SELinux DEVELOP=y)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
